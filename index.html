<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAN PHOTOBOOTH</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ของตกแต่ง -->
    <div class="deco deco-left-top">
        Just<br>a moment<br> :)
    </div>

    <div class="deco deco-right-top">
        Good<br>Photo<br>Good Day ♡
    </div>

    <div class="deco deco-left-bottom">
        📷<br>Smile :)
    </div>

    <div class="deco deco-right-middle">
        ♡<br>
        Better<br>Version<br>of Me
    </div>


    <main class="container">

        <!-- หัวเว็บ -->
        <header>
            <h1>
                📷 KAN <span>PHOTOBOOTH</span>
            </h1>

            <p>เก็บโมเมนต์เล็กๆ ในแบบเรา ♡</p>
        </header>


        <!-- กล้อง -->
        <section class="camera-section">

            <div class="camera-box">

                <video
                    id="video"
                    autoplay
                    playsinline>
                </video>

                <div class="counter">
                    รูปที่ <span id="photoCount">0</span>/4
                </div>

            </div>


            <!-- ปุ่ม -->
            <div class="buttons">

                <button
                    id="startCamera"
                    class="btn btn-dark">

                    ✅ เปิดกล้องแล้ว

                </button>


                <button
                    id="startPhoto"
                    class="btn btn-pink">

                    📷 เริ่มถ่าย 4 รูป

                </button>

            </div>

        </section>


        <!-- รูป 4 ช่อง -->
        <section class="photo-grid">

            <div class="photo-slot" id="slot1">

                <div class="placeholder">
                    🖼️
                </div>

                <span>1</span>

            </div>


            <div class="photo-slot" id="slot2">

                <div class="placeholder">
                    🖼️
                </div>

                <span>2</span>

            </div>


            <div class="photo-slot" id="slot3">

                <div class="placeholder">
                    🖼️
                </div>

                <span>3</span>

            </div>


            <div class="photo-slot" id="slot4">

                <div class="placeholder">
                    🖼️
                </div>

                <span>4</span>

            </div>

        </section>


        <!-- ปุ่มเริ่มใหม่ -->
        <button
            id="resetBtn"
            class="reset-btn">

            🔄 ถ่ายใหม่

        </button>


        <!-- ข้อความล่าง -->
        <div class="footer-text">

            — ถ่าย 4 รูป สร้างโมเมนต์ของคุณ —

            <br>

            <span>♡ by KAN</span>

        </div>

    </main>


    <canvas id="canvas"></canvas>

    <script src="script.js"></script>

</body>
</html>
